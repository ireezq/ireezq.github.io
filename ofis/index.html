<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Офис агентов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#1d2230; --panel:#262c3d; --text:#f2f2f5; --muted:#9aa3b8;
    --floor-boss:#e9d8b4; --floor-mk:#dfe7f2; --floor-sc:#e1efdf; --floor-vid:#ece2f3; --floor-rest:#f4e6d6; --floor-ig:#f8e1ea; --floor-tg:#dcedf8; --floor-yt:#f7e0de; --floor-tt:#e4e4ea;
    --corridor:#c9ccd3; --wall:#4a4f5e;
    --work:#2ecc71; --rest:#7f8fa6; --wait:#f1c40f; --err:#e74c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5000;background:var(--panel);padding:10px 14px 8px;box-shadow:0 2px 10px #0006}
  header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  .badge{font-size:10px;font-weight:700;background:#f39c12;color:#222;border-radius:6px;padding:2px 6px}
  .badge.live{background:var(--work)}
  .counts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .cnt{font-size:12px;background:#1d2230;border-radius:20px;padding:3px 9px;display:flex;gap:5px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%}
  #wrap{position:relative;margin:10px auto 0;overflow:hidden}
  #map{position:absolute;left:0;top:0;width:360px;height:1335px;transform-origin:0 0}
  .room{position:absolute;border:3px solid var(--wall);border-radius:6px}
  .room .lbl{position:absolute;left:5px;top:3px;font-size:10px;font-weight:800;color:#0009;letter-spacing:.3px;text-transform:uppercase;background:#fff9;padding:1px 4px;border-radius:4px;max-width:138px;z-index:2}
  .door{position:absolute;background:var(--corridor);width:3px;height:26px}
  .corr{position:absolute;background:var(--corridor)}
  .desk{position:absolute;width:30px;height:13px;background:#a0703f;border-radius:2px;box-shadow:0 2px 0 #6e4a27}
  .desk.big{width:46px;height:16px;background:#7b4b26}
  .laptop{position:absolute;left:50%;top:-6px;width:13px;height:8px;margin-left:-6.5px;background:#555b6a;border-radius:1.5px 1.5px 0 0}
  .laptop.on{background:#8fd3ff;box-shadow:0 0 8px #8fd3ff}
  .deco{position:absolute;font-size:14px;line-height:1;pointer-events:none}
  .sofa{position:absolute;background:#c0504d;border-radius:7px;box-shadow:inset 0 -5px 0 #9b3b39}
  .bean{position:absolute;width:24px;height:16px;border-radius:50%;}
  .rug{position:absolute;border-radius:50%;background:#e8cfa9}
  .scr{position:absolute;border-radius:3px;border:2px solid #222;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:10px;animation:glow 2.4s ease-in-out infinite alternate;pointer-events:none}
  .ringl{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fffbe6;box-shadow:0 0 8px 3px #fff6,inset 0 0 4px #fff8;pointer-events:none}
  .ringl:after{content:'';position:absolute;left:5px;top:16px;width:2px;height:16px;background:#555}
  .flt{animation:flt 3.2s ease-in-out infinite}
  .swim{animation:swim 7s linear infinite alternate}
  .steam{animation:steam 2.2s ease-out infinite;opacity:.0}
  .fan{animation:spin 1.4s linear infinite}
  .win{position:absolute;border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 2px #4a4f5e;overflow:hidden;pointer-events:none;font-size:9px;text-align:right;padding:1px 2px}
  .clock{position:absolute;background:#1d2230;color:#7CFC9A;font:800 10px monospace;padding:2px 4px;border-radius:3px;pointer-events:none}
  .tank{position:absolute;border:2px solid #9fd3e8;border-radius:4px;background:linear-gradient(#bfe8f7,#5bb4d8);overflow:hidden;pointer-events:none}
  .tank .deco{position:absolute}
  .board{position:absolute;background:#fff;border:2px solid #8a8f9c;border-radius:2px;pointer-events:none}
  @keyframes glow{from{filter:brightness(.85)}to{filter:brightness(1.25)}}
  @keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes swim{from{transform:translateX(0) scaleX(1)}49%{transform:translateX(38px) scaleX(1)}51%{transform:translateX(38px) scaleX(-1)}to{transform:translateX(0) scaleX(-1)}}
  @keyframes steam{0%{transform:translateY(0);opacity:.0}30%{opacity:.8}100%{transform:translateY(-10px);opacity:0}}
  .counter{position:absolute;background:#8a6a4a;border-radius:3px}
  .agent{position:absolute;left:0;top:0;width:30px;height:50px;cursor:pointer;will-change:transform}
  .agent .fig{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .agent.walk .fig{animation:bob .4s ease-in-out infinite}
  .agent svg{display:block;overflow:visible;position:relative}
  .ring{position:absolute;left:2px;bottom:-4px;width:26px;height:9px;border-radius:50%;background:var(--rest);opacity:.5}
  .agent.s-work .ring{background:var(--work);opacity:.8;animation:ring 1.4s ease-in-out infinite}
  .agent.s-wait .ring{background:var(--wait);opacity:.9;animation:ring .9s ease-in-out infinite}
  .agent.s-err .ring{background:var(--err);opacity:.9;animation:ring .5s ease-in-out infinite}
  .lg{transform-box:fill-box;transform-origin:50% 0}
  .agent.walk .lg.l{animation:legL .4s ease-in-out infinite}
  .agent.walk .lg.r{animation:legL .4s ease-in-out infinite reverse}
  .arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .3s}
  .agent.typing .arm.l{animation:type .22s ease-in-out infinite alternate}
  .agent.typing .arm.r{animation:type .22s ease-in-out infinite alternate-reverse}
  .agent.typing .fig{animation:bob 1.2s ease-in-out infinite}
  .agent.reading .arm.l{transform:rotate(-42deg)}.agent.reading .arm.r{transform:rotate(42deg)}
  .agent.reading .fig{animation:nod 2.4s ease-in-out infinite}
  .agent.gaming .arm.l{animation:pad .18s infinite alternate}.agent.gaming .arm.r{animation:pad .18s infinite alternate-reverse}
  .agent.thinking .arm.r{transform:rotate(150deg)}.agent.thinking .fig{animation:think 3s ease-in-out infinite}
  .agent.talking .arm.r{animation:wave .5s ease-in-out infinite alternate}
  .agent.talking .fig{animation:bob .8s ease-in-out infinite}
  .agent.sipping .arm.r{animation:sip 3s ease-in-out infinite}
  .agent.sipping .prop{animation:sipP 3s ease-in-out infinite}
  .agent.stretch .arm.l{animation:strL 1.6s ease-in-out infinite}.agent.stretch .arm.r{animation:strR 1.6s ease-in-out infinite}
  .agent.stretch .fig,.agent.jump .fig{animation:hop .6s ease-in-out infinite}
  .agent.jump .arm.r{animation:wave .3s ease-in-out infinite alternate}
  .agent.shake .fig{animation:shake .35s linear infinite}
  .agent.waitp .arm.r{transform:rotate(165deg)}
  .agent.sleep .fig{transform:rotate(-8deg);animation:none}
  .prop{position:absolute;left:50%;top:23px;transform:translateX(-50%);font-size:11px;line-height:1;display:none;pointer-events:none;z-index:2}
  .eyes-c{display:none}
  .agent.sleep .eyes{display:none}.agent.sleep .eyes-c{display:block}
  .name{position:absolute;top:54px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:8.5px;font-weight:800;color:#222;background:#fffffff0;border-radius:4px;padding:0 3px;pointer-events:none;box-shadow:0 1px 2px #0003}
  .bubble{position:absolute;bottom:47px;z-index:3;left:50%;transform:translateX(-50%);background:#fff;color:#222;border-radius:8px;padding:1px 4px;font-size:8.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px #0006;pointer-events:none;border:1.5px solid var(--work)}
  .bubble:after{content:"";position:absolute;left:50%;margin-left:-3px;bottom:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#fff}
  .bubble.err{background:var(--err);color:#fff;border-color:#fff;animation:pulse .6s infinite alternate}.bubble.err:after{border-top-color:var(--err)}
  .bubble.wait{background:var(--wait);border-color:#fff;animation:pulse .9s infinite alternate}.bubble.wait:after{border-top-color:var(--wait)}
  .bubble.rest{background:#ffffffd0;border-color:#bbb;font-weight:600;color:#555}
  .agent.hi .bubble{bottom:60px}
  .bubble .al{display:none;font-weight:600}
  #map.zoomed .bubble .al{display:inline}
  .agent.sel .bubble{background:#ffd54a;color:#222}
  .spin{display:inline-block;animation:spin 1.2s linear infinite}
  .room{cursor:zoom-in}
  #zoomOut{display:none;margin-left:auto;background:#2e86de;color:#fff;border:0;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
  #map{transition:transform .35s ease}
  #map.drag{transition:none}
  #wrap{touch-action:pan-y}
  #wrap{transition:height .35s ease}
  .hint2{font-size:11px;color:var(--muted);margin-top:6px}
  .row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #ffffff12;cursor:pointer}
  .row .em{font-size:22px;width:28px;text-align:center}
  .row .nm{font-weight:700;font-size:14px}
  .row .tk{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.3}
  .row .chip{font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 8px;color:#111;white-space:nowrap}
  .row .ag{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
  @keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) translateY(.6px)}}
  @keyframes pad{from{transform:rotate(-38deg)}to{transform:rotate(-46deg)}}
  @keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
  @keyframes wave{from{transform:rotate(140deg)}to{transform:rotate(195deg)}}
  @keyframes sip{0%,55%,100%{transform:rotate(20deg)}65%,85%{transform:rotate(150deg)}}
  @keyframes sipP{0%,55%,100%{transform:translate(2px,0)}65%,85%{transform:translate(2px,-13px)}}
  @keyframes strL{0%,100%{transform:rotate(0)}50%{transform:rotate(170deg)}}
  @keyframes strR{0%,100%{transform:rotate(0)}50%{transform:rotate(-170deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
  @keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.12)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dots i{display:inline-block;width:2px;height:2px;margin:0 .5px;border-radius:50%;background:#555;animation:dot 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  .agent.sel .name{background:#ffd54a}
  @keyframes legL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes type{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  @keyframes zz{0%,100%{transform:translate(0,0);opacity:.6}50%{transform:translate(3px,-4px);opacity:1}}
  @keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
  section.feed{max-width:480px;margin:12px auto 30px;padding:0 14px}
  section.feed h2{font-size:14px;margin:0 0 6px;color:var(--muted)}
  .ev{font-size:13px;padding:7px 0;border-bottom:1px solid #ffffff12;display:flex;gap:8px}
  .ev time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6000;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 18px 26px;transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -4px 20px #0008;max-width:520px;margin:0 auto}
  #sheet.open{transform:none}
  #sheet .hd{display:flex;align-items:center;gap:10px}
  #sheet .em{font-size:30px}
  #sheet h3{margin:0;font-size:18px}
  #sheet .role{color:var(--muted);font-size:13px;margin-top:2px}
  #sheet .st{display:inline-flex;align-items:center;gap:6px;margin:12px 0 6px;font-weight:700;font-size:14px}
  #sheet .task{font-size:15px;line-height:1.4}
  #sheet .meta{color:var(--muted);font-size:12px;margin-top:8px}
  #sheet .order{margin-top:14px}
  #sheet textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid #ffffff22;background:#1d2230;color:var(--text);padding:9px;font:inherit;font-size:15px;resize:vertical}
  #sheet .send{margin-top:8px;width:100%;padding:11px;border:0;border-radius:10px;background:#2e86de;color:#fff;font-weight:700;font-size:15px}
  #sheet .send:disabled{opacity:.5}
  #sheet .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.4}
  #sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:22px}
</style>
</head>
<body>
<header>
  <h1>🏢 Офис агентов <span id="mode" class="badge">ДЕМО</span> <button id="zoomOut" onclick="event.stopPropagation();zoomTo(null)">← Весь офис</button></h1>
  <div class="counts" id="counts"></div>
</header>
<div id="wrap"><div id="map"></div></div>
<div class="hint2">🤏 Два пальца — приблизить/отдалить, одним — двигать · нажмите на комнату или человека</div>
<section class="feed"><h2>Кто чем занят</h2><div id="list"></div></section>
<section class="feed"><h2>Что происходит</h2><div id="feed"></div></section>
<div id="sheet"><button class="x" onclick="closeSheet()">×</button><div id="sheetBody"></div></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#262c3d'); tg.setBackgroundColor && tg.setBackgroundColor('#1d2230'); } catch(e){} }

/* ---------- Комнаты ---------- */
const CX = 180; // ось коридора
const ROOMS = {
  boss: {x:10, y:10, w:150,h:160, side:'L', doorY:95,  floor:'--floor-boss', label:'🎯 Кабинет маркетолога'},
  sc:   {x:200,y:10, w:150,h:160, side:'R', doorY:95,  floor:'--floor-sc',   label:'🔍 Разведка'},
  mkL:  {x:10, y:180,w:150,h:210, side:'L', doorY:285, floor:'--floor-mk',   label:'📦 Товары и дизайн'},
  mkR:  {x:200,y:180,w:150,h:210, side:'R', doorY:285, floor:'--floor-mk',   label:'🛒 Маркетплейсы'},
  vidL: {x:10, y:400,w:150,h:210, side:'L', doorY:505, floor:'--floor-vid',  label:'🎬 Видеостудия'},
  vidR: {x:200,y:400,w:150,h:210, side:'R', doorY:505, floor:'--floor-vid',  label:'🎬 Видеостудия'},
  ig:   {x:10, y:620,w:150,h:210, side:'L', doorY:725, floor:'--floor-ig',   label:'📸 Instagram'},
  tg:   {x:200,y:620,w:150,h:210, side:'R', doorY:725, floor:'--floor-tg',   label:'✈️ Telegram'},
  yt:   {x:10, y:840,w:150,h:210, side:'L', doorY:945, floor:'--floor-yt',   label:'▶️ YouTube'},
  tt:   {x:200,y:840,w:150,h:210, side:'R', doorY:945, floor:'--floor-tt',   label:'🎵 TikTok'},
  rest: {x:10, y:1060,w:340,h:265,side:'B', doorY:1060,floor:'--floor-rest', label:'☕ Зона отдыха'},
};
function inner(r){ const R=ROOMS[r]; if(R.side==='L') return [R.x+R.w-12,R.doorY+12]; if(R.side==='R') return [R.x+12,R.doorY+12]; return [CX,R.y+22]; }
function corr(r){ const R=ROOMS[r]; return R.side==='B' ? [CX,R.y-6] : [CX,R.doorY+12]; }

/* ---------- Агенты ---------- */
const SK=['#f1c7a0','#e0ac80','#c68c5c','#a8714a'], HR=['#2b1d14','#3a2a1a','#111','#5a3b22','#6b6b6b'];
const DEPT={boss:'#c0392b', mk:'#2e86de', sc:'#27ae60', vid:'#8e44ad', ig:'#d6336c', tg:'#1c93d1', yt:'#d62828', tt:'#2b2b2b'};
const A = [
 ['marketolog','Маркетолог','Руководит всей командой','🎯','boss','boss',{tie:1}],
 ['razvedchik','Гл. разведчик','Руководит разведчиками','🔍','sc','sc',{cap:0}],
 ['r_insta','Разв. Insta','Разведка Instagram','📸','sc','sc',{}],
 ['r_uzum','Разв. Uzum','Наши карточки против конкурентов на Uzum','🟣','sc','sc',{}],
 ['r_wb','Разв. WB','Разведка Wildberries','🟪','sc','sc',{}],
 ['tovaroved','Товаровед','Остатки, цены, товары','📦','mk','mkL',{}],
 ['kontent','Контент-план','Расписание постов и сторис','📅','mk','mkL',{}],
 ['dizayner','Дизайнер','Обложки, картинки','🖌','mk','mkL',{cap:1}],
 ['kitay','Китай','Поиск товаров на 1688/Taobao','🇨🇳','mk','mkL',{}],
 ['sahifachi','Сайт','Страницы товаров','🌐','mk','mkR',{}],
 ['targetolog','Таргетолог','Реклама (подготовка)','💰','mk','mkR',{glasses:1}],
 ['uzum_analitik','Аналит. Uzum','Продажи и карточки Uzum: идём вверх или вниз','📈','mk','mkR',{glasses:1}],
 ['wb_analitik','Аналит. WB','Продажи и карточки Wildberries','📉','mk','mkR',{}],
 ['direktor','Директор','Руководит видео','🧠','vid','vidL',{beard:1}],
 ['analitik','Аналитик','Разбор товара и отзывов','🔎','vid','vidL',{glasses:1}],
 ['ssenarist','Сценарист','Сценарии Reels','📝','vid','vidL',{}],
 ['ovoz','Голос','Озвучка на узбекском','🎙','vid','vidL',{beard:1}],
 ['vizual','Визуал','Кадры и сцены','🎨','vid','vidR',{cap:1}],
 ['montajyor','Монтажёр','Сборка Reels','🎬','vid','vidR',{}],
 ['instagram','Instagram','Главный по Instagram, ведёт команду','📸','ig','ig',{tie:1},'Маркетологу'],
 ['smm','SMM','Профиль @tecnologia.uz','👤','ig','ig',{}],
 ['storis','Сторис','Сторис Instagram','📱','ig','ig',{}],
 ['statistika','Статистика','Охваты и просмотры Instagram','📊','ig','ig',{glasses:1}],
 ['publikator','Публикатор','Публикация Reels и сторис','📤','ig','ig',{}],
 ['otvetchik','Ответчик','Ответы на «+»','💬','ig','ig',{}],
 ['telegram','Telegram','Главный по Telegram-группе @mgznuz','✈️','tg','tg',{tie:1},'Маркетологу'],
 ['kanalchi','Канал','Посты в Telegram-канал и группу','📢','tg','tg',{}],
 ['tg_analitik','Аналит. TG','Цифры Telegram-группы','📊','tg','tg',{glasses:1}],
 ['youtube','YouTube','Главный по YouTube, команда Shorts','▶️','yt','yt',{tie:1},'Маркетологу'],
 ['yt_upakovka','Упаковка YT','Заголовки, обложки, описания Shorts','🖼','yt','yt',{cap:1}],
 ['yt_publikator','Публ. YT','Публикация Shorts','📤','yt','yt',{}],
 ['yt_otvetchik','Ответ. YT','Ответы на комментарии YouTube','💬','yt','yt',{}],
 ['yt_analitik','Аналит. YT','Просмотры и досмотры Shorts','📊','yt','yt',{glasses:1}],
 ['tiktok','TikTok','Главный по TikTok, команда клипов','🎵','tt','tt',{tie:1},'Маркетологу'],
 ['tt_montajyor','Монтаж TT','Адаптация роликов под TikTok','🎬','tt','tt',{cap:1}],
 ['tt_publikator','Публ. TT','Публикация в TikTok','📤','tt','tt',{}],
 ['tt_otvetchik','Ответ. TT','Ответы на комментарии TikTok','💬','tt','tt',{}],
 ['tt_analitik','Аналит. TT','Просмотры и досмотры TikTok','📊','tt','tt',{glasses:1}],
];
const REPORTS={sc:'Маркетологу (через Гл. разведчика)', mk:'Маркетологу', vid:'Директору', boss:'Вам',
  ig:'Instagram-главному', tg:'Telegram-главному', yt:'YouTube-главному', tt:'TikTok-главному'};

/* места за столами */
const SEATS={boss:[[85,110]], sc:[[245,78],[305,78],[245,148],[305,148]]};
['mkL','mkR','vidL','vidR','ig','tg','yt','tt'].forEach(r=>{const R=ROOMS[r], v=r.startsWith('vid'), rows=v?2:3; SEATS[r]=[];
  for(let i=0;i<rows;i++) for(const dx of [38,100]) SEATS[r].push([R.x+dx, R.y+(v?70:62)+i*(v?80:60)]);});

/* маршруты */
const restUsed=new Set(), queueUsed=new Set();
function freeSpot(list,used){ const idx=list.map((_,i)=>i).filter(i=>!used.has(i)); return idx.length? idx[Math.floor(Math.random()*idx.length)] : 0; }
function route(a,target,troom){
  const pts=[]; const from=a.cur;
  if(from!==troom){
    if(from!=='corr'){pts.push(inner(from),corr(from));}
    if(troom!=='corr'){pts.push(corr(troom),inner(troom));}
  }
  pts.push(target); a.path=pts; a.cur=troom;
}
function releaseSpot(a){ a.ract=null; if(a.spot){ (a.spot.t==='rest'?restUsed:queueUsed).delete(a.spot.i); a.spot=null; } }

const LBL={work:'Работает',rest:'Отдыхает',wait:'Ждёт одобрения',err:'Проблема'};
const CLR={work:'var(--work)',rest:'var(--rest)',wait:'var(--wait)',err:'var(--err)'};

const ACT={type:['⌨️','пишет','typing'],read:['📖','читает','reading','📄'],run:['⚙️','запускает','typing'],web:['🌐','в браузере','reading','💻'],
 talk:['💬','пишет коллеге','talking'],team:['👥','с помощником','talking'],art:['🎨','рисует','typing'],think:['💭','думает','thinking']};
const RACT={sleep:['💤','спит','sleep'],sit:['😌','отдыхает',''],coffee:['☕','пьёт кофе','sipping','☕'],game:['🎮','играет','gaming','🎮'],book:['📕','читает книгу','reading','📕'],
 phone:['📱','в телефоне','reading','📱'],stretch:['🙆','разминка','stretch'],chat:['🗣','болтает','talking'],pong:['🏓','пинг-понг','jump','🏓']};
const SPOT_R=i=> i<6?['sleep','sit','phone','book']: i<8?['coffee','chat']: i<16?['game','sit','phone','sleep']:['stretch','pong','book','chat','phone'];
const ANIMS=['typing','reading','gaming','thinking','talking','sipping','stretch','jump','shake','waitp','sleep','hi'];
const pick=l=>l[Math.floor(Math.random()*l.length)];
function actInfo(a){ if(a.state==='work') return ACT[a.act]||ACT.think; if(a.state==='wait') return ['📄','ждёт ответа','waitp']; if(a.state==='err') return ['⚠️','ошибка','shake']; return RACT[a.ract]||RACT.sit; }
function setState(a,state,task,since,act){
  const changed = a.state!==state || a.task!==(task||'');
  const prev=a.state; a.state=state; a.task=task||''; a.since=since||Date.now(); if(act) a.act=act;
  if(prev!==state){ releaseSpot(a);
    if(state==='work'||state==='err') route(a,a.seat,a.room);
    else if(state==='rest'){ goRest(a); }
    else if(state==='wait' && a.id==='marketolog'){ route(a,a.seat,a.room); }
    else if(state==='wait'){ const i=freeSpot(QUEUE,queueUsed); queueUsed.add(i); a.spot={t:'wait',i}; route(a,QUEUE[i],'corr'); } }
  decorate(a); if(changed) logEvent(a); renderCounts(); listSoon(); if(sheetA===a) openSheet(a);
}
function goRest(a){ const i=freeSpot(REST,restUsed); restUsed.add(i); a.spot={t:'rest',i}; a.nextR=Date.now()+12000+Math.random()*23000; route(a,REST[i],'rest'); }
function setAct(a,act){ if(a.act===act) return; a.act=act; decorate(a); listSoon(); if(sheetA===a) openSheet(a); }
function decorate(a){
  const moving=a.path.length>0, e=a.e; ANIMS.forEach(c=>e.classList.remove(c));
  e.classList.toggle('walk',moving); ['work','rest','wait','err'].forEach(s=>e.classList.toggle('s-'+s,a.state===s));
  a.laptop.classList.toggle('on',!moving&&(a.state==='work'||a.state==='err'));
  const b=a.bub; b.className='bubble';
  if(a.state==='rest' && !a.ract && a.spot) a.ract=pick(SPOT_R(a.spot.i));
  const [ic,lb,cls,pr]=actInfo(a); if(a.state!=='work') b.classList.add(a.state);
  if(moving){ a.prop.style.display='none'; b.innerHTML=`${a.state==='rest'?'🚶':'🏃'} ${a.name}`; return; }
  if(cls) e.classList.add(cls); if(a.spot&&a.spot.t==='rest'&&a.spot.i%2) e.classList.add('hi');
  a.prop.style.display=pr?'block':'none'; if(pr) a.prop.textContent=pr;
  b.innerHTML=(a.state==='work'&&a.act==='run'?`<span class="spin">${ic}</span>`:ic)+` ${a.name}<span class="al"> · ${lb}</span>`;
}
function actLabel(a){ const [ic,lb]=actInfo(a); return ic+' '+lb; }
setInterval(()=>{ const now=Date.now(); for(const id in agents){ const a=agents[id]; if(a.state!=='rest'||a.path.length||!a.spot||now<a.nextR) continue;
    if(Math.random()<.55){ releaseSpot(a); goRest(a); decorate(a); }
    else { const l=SPOT_R(a.spot.i).filter(x=>x!==a.ract); a.ract=pick(l); a.nextR=now+12000+Math.random()*23000; decorate(a); }
    listSoon(); } },2000);

/* движение */
let last=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  for(const id in agents){ const a=agents[id]; if(!a.path.length) continue;
    const [tx,ty]=a.path[0]; const dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy), step=62*dt;
    if(d<=step){ a.x=tx;a.y=ty;a.path.shift(); if(!a.path.length) decorate(a); }
    else { a.x+=dx/d*step; a.y+=dy/d*step; if(!a.e.classList.contains('walk')) decorate(a); }
    place(a);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* масштаб под экран */
let ZOOM=null, VK=1, VX=0, VY=0;   // VK — увеличение (1 = весь офис), VX/VY — сдвиг карты в px
const wrapE=document.getElementById('wrap');
function geo(){ const w=Math.min(document.documentElement.clientWidth,520)-8, b=w/360, full=1335*b;
  const H=VK>1.01?Math.min(full,Math.max(320,innerHeight-130)):full; return {w,b,H}; }
function clampV(){ const {w,b,H}=geo(), S=b*VK; VX=Math.min(0,Math.max(w-360*S,VX)); VY=Math.min(0,Math.max(H-1335*S,VY)); }
function fit(){ const {w,b,H}=geo(); wrapE.style.width=w+'px'; wrapE.style.height=H+'px'; clampV();
  map.style.transform=`translate(${VX}px,${VY}px) scale(${b*VK})`;
  map.classList.toggle('zoomed',VK>1.5); document.getElementById('zoomOut').style.display=VK>1.01?'inline-block':'none'; }
function zoomTo(k){ ZOOM=k;
  if(!k){ VK=1; VX=VY=0; fit(); return; }
  const R=ROOMS[k]; VK=Math.min(4,360/(R.w+12)); const {w,b,H}=geo(), S=b*VK;
  VX=w/2-(R.x+R.w/2)*S; VY=H/2-(R.y+R.h/2)*S; fit(); wrapE.scrollIntoView({behavior:'smooth',block:'start'}); }
function zoomAt(nk,cx,cy){ // увеличить вокруг точки (cx,cy) внутри рамки
  nk=Math.min(4,Math.max(1,nk)); const {b}=geo(); const mx=(cx-VX)/(b*VK), my=(cy-VY)/(b*VK);
  VK=nk; VX=cx-mx*b*VK; VY=cy-my*b*VK; ZOOM=null; fit(); }

/* два пальца — увеличить/уменьшить, один палец при увеличении — двигать */
let G=null, moved=false;
const pts=t=>{ const r=wrapE.getBoundingClientRect(); return [...t].map(p=>[p.clientX-r.left,p.clientY-r.top]); };
wrapE.addEventListener('touchstart',e=>{ const p=pts(e.touches); moved=false;
  if(p.length>=2){ const [a,c]=p; G={two:true,d:Math.hypot(a[0]-c[0],a[1]-c[1]),k:VK,cx:(a[0]+c[0])/2,cy:(a[1]+c[1])/2,vx:VX,vy:VY}; map.classList.add('drag'); }
  else if(VK>1.01){ G={two:false,x:p[0][0],y:p[0][1],vx:VX,vy:VY}; map.classList.add('drag'); }
  else G=null; },{passive:true});
wrapE.addEventListener('touchmove',e=>{ if(!G) return; const p=pts(e.touches);
  if(G.two && p.length>=2){ e.preventDefault(); const [a,c]=p, d=Math.hypot(a[0]-c[0],a[1]-c[1]), cx=(a[0]+c[0])/2, cy=(a[1]+c[1])/2;
    VX=G.vx+(cx-G.cx); VY=G.vy+(cy-G.cy); VK=G.k; zoomAt(G.k*d/G.d, cx, cy); moved=true; }
  else if(!G.two && p.length===1){ const dx=p[0][0]-G.x, dy=p[0][1]-G.y; if(!moved&&Math.hypot(dx,dy)<6) return;
    e.preventDefault(); moved=true; VX=G.vx+dx; VY=G.vy+dy; fit(); } },{passive:false});
wrapE.addEventListener('touchend',e=>{ if(e.touches.length===0){ map.classList.remove('drag'); if(VK<1.05){ VK=1; fit(); } G=null; }
  else if(e.touches.length===1 && G && G.two){ const p=pts(e.touches); G={two:false,x:p[0][0],y:p[0][1],vx:VX,vy:VY}; } });
wrapE.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true); // после жеста не открывать карточку
// компьютер: жест на тачпаде / Ctrl+колесо
wrapE.addEventListener('wheel',e=>{ if(!e.ctrlKey) return; e.preventDefault(); const r=wrapE.getBoundingClientRect();
  map.classList.add('drag'); zoomAt(VK*Math.exp(-e.deltaY/200), e.clientX-r.left, e.clientY-r.top); clearTimeout(wrapE._t); wrapE._t=setTimeout(()=>map.classList.remove('drag'),150); },{passive:false});
if(tg && tg.disableVerticalSwipes) try{ tg.disableVerticalSwipes(); }catch(e){}

let KEY=null;
try{ const q=new URLSearchParams(location.search).get('k'); if(q){ localStorage.setItem('office_k',q); history.replaceState(null,'',location.pathname+location.hash); } KEY=localStorage.getItem('office_k'); }catch(e){ KEY=new URLSearchParams(location.search).get('k'); }
const STATUS_URL='https://raw.githubusercontent.com/ireezq/ireezq.github.io/status/s.txt';
function b64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function fetchStatus(){
  if(!KEY) return null;
  const r=await fetch(STATUS_URL+'?t='+Math.floor(Date.now()/15000),{cache:'no-store'}); if(!r.ok) throw 0;
  const raw=b64((await r.text()).trim());
  const key=await crypto.subtle.importKey('raw',b64(KEY),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function snapAll(){ for(const id in agents){ const a=agents[id]; if(a.path.length){ const p=a.path[a.path.length-1]; a.x=p[0];a.y=p[1];a.path=[];a.cur=(a.state==='rest'?'rest':a.state==='wait'&&a.id!=='marketolog'?'corr':a.room); place(a); decorate(a);} } }
const STALE_MIN=90;
async function loadReal(){
  try{
    const j=await fetchStatus(); if(!j||!j.agents) throw 0;
    document.getElementById('mode').textContent='LIVE'; document.getElementById('mode').classList.add('live');
    for(const id in agents){ const s=j.agents[id]; const a=agents[id];
      let st=s?s.state:'rest', since=s&&s.since?Date.parse(s.since):Date.now();
      if((st==='work') && Date.now()-since>STALE_MIN*60000) st='rest';
      if(!LBL[st]) st='rest';
      const act=s&&s.act;
      if(st!==a.state || (s&&s.task||'')!==a.task) setState(a,st,s&&s.task,since,act);
      else if(act && st==='work') setAct(a,act);
    }
    return true;
  }catch(e){ return false; }
}

function demoPick(id){ const r=Math.random(); const st = r<.52?'work':r<.86?'rest':r<.96?'wait':'err';
  const t=DEMO_TASKS[id]||['Работаю']; let task=t[Math.floor(Math.random()*t.length)];
  if(st==='wait') task=(id==='marketolog'?'Жду вашего ответа: ':'Сдал работу: ')+task.toLowerCase(); if(st==='err') task='Не получилось: '+task.toLowerCase();
  return [st,task]; }
(async()=>{
  const live=await loadReal();
  if(live){ snapAll(); booting=false; setInterval(loadReal,15000); }
  else if(KEY){ const m=document.getElementById('mode'); m.textContent='НЕТ СВЯЗИ'; m.style.background='var(--err)';
    for(const id in agents) setState(agents[id],'rest',''); snapAll(); booting=false;
    const iv=setInterval(async()=>{ if(await loadReal()) { clearInterval(iv); setInterval(loadReal,15000); } },15000); }
  else {
    const AK=Object.keys(ACT); for(const id in agents){ const [s,t]=demoPick(id); setState(agents[id],s,t,Date.now()-Math.random()*40*60000,pick(AK)); }
    snapAll();
    booting=false;
    setInterval(()=>{ const ids=Object.keys(agents); const a=agents[ids[Math.floor(Math.random()*ids.length)]]; if(a.path.length) return; const [s,t]=demoPick(a.id); setState(a,s,t,0,pick(AK)); },3500);
    setInterval(()=>{ const w=Object.values(agents).filter(a=>a.state==='work'&&!a.path.length); if(w.length) setAct(pick(w),pick(AK)); },2500);
  }
  renderCounts();
})();
