<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Офис агентов</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#1d2230; --panel:#262c3d; --text:#f2f2f5; --muted:#9aa3b8;
    --floor-boss:#e9d8b4; --floor-mk:#dfe7f2; --floor-sc:#e1efdf; --floor-vid:#ece2f3; --floor-rest:#f4e6d6;
    --corridor:#c9ccd3; --wall:#4a4f5e;
    --work:#2ecc71; --rest:#7f8fa6; --wait:#f1c40f; --err:#e74c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5000;background:var(--panel);padding:10px 14px 8px;box-shadow:0 2px 10px #0006}
  header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  .badge{font-size:10px;font-weight:700;background:#f39c12;color:#222;border-radius:6px;padding:2px 6px}
  .badge.live{background:var(--work)}
  .counts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .cnt{font-size:12px;background:#1d2230;border-radius:20px;padding:3px 9px;display:flex;gap:5px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%}
  #wrap{position:relative;margin:10px auto 0;overflow:hidden}
  #map{position:absolute;left:0;top:0;width:360px;height:895px;transform-origin:0 0}
  .room{position:absolute;border:3px solid var(--wall);border-radius:6px}
  .room .lbl{position:absolute;left:5px;top:3px;font-size:8px;font-weight:800;color:#0009;letter-spacing:.3px;text-transform:uppercase}
  .door{position:absolute;background:var(--corridor);width:3px;height:26px}
  .corr{position:absolute;background:var(--corridor)}
  .desk{position:absolute;width:30px;height:13px;background:#a0703f;border-radius:2px;box-shadow:0 2px 0 #6e4a27}
  .desk.big{width:46px;height:16px;background:#7b4b26}
  .laptop{position:absolute;left:50%;top:-6px;width:13px;height:8px;margin-left:-6.5px;background:#555b6a;border-radius:1.5px 1.5px 0 0}
  .laptop.on{background:#8fd3ff;box-shadow:0 0 8px #8fd3ff}
  .deco{position:absolute;font-size:14px;line-height:1;pointer-events:none}
  .sofa{position:absolute;background:#c0504d;border-radius:7px;box-shadow:inset 0 -5px 0 #9b3b39}
  .bean{position:absolute;width:24px;height:16px;border-radius:50%;}
  .rug{position:absolute;border-radius:50%;background:#e8cfa9}
  .counter{position:absolute;background:#8a6a4a;border-radius:3px}
  .agent{position:absolute;left:0;top:0;width:24px;height:40px;cursor:pointer;will-change:transform}
  .agent .fig{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .agent.walk .fig{animation:bob .4s ease-in-out infinite}
  .agent svg{display:block;overflow:visible}
  .lg{transform-box:fill-box;transform-origin:50% 0}
  .agent.walk .lg.l{animation:legL .4s ease-in-out infinite}
  .agent.walk .lg.r{animation:legL .4s ease-in-out infinite reverse}
  .arm{transform-box:fill-box;transform-origin:50% 0}
  .agent.typing .arm.l{animation:type .25s ease-in-out infinite alternate}
  .agent.typing .arm.r{animation:type .25s ease-in-out infinite alternate-reverse}
  .eyes-c{display:none}
  .agent.sleep .eyes{display:none}.agent.sleep .eyes-c{display:block}
  .name{position:absolute;top:41px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:6.5px;font-weight:800;color:#222;background:#ffffffd9;border-radius:3px;padding:0 2px;pointer-events:none}
  .bubble{position:absolute;bottom:30px;left:17px;background:#fff;color:#222;border-radius:7px;padding:1px 4px;font-size:9px;white-space:nowrap;box-shadow:0 1px 3px #0005;pointer-events:none}
  .bubble:after{content:"";position:absolute;left:2px;bottom:-3px;border:3px solid transparent;border-bottom:0;border-top-color:#fff}
  .bubble.err{background:var(--err);color:#fff;font-weight:900}.bubble.err:after{border-top-color:var(--err)}
  .bubble.wait{background:var(--wait)}.bubble.wait:after{border-top-color:var(--wait)}
  .bubble.rest{background:none;box-shadow:none;animation:zz 2s ease-in-out infinite}.bubble.rest:after{display:none}
  .dots i{display:inline-block;width:2px;height:2px;margin:0 .5px;border-radius:50%;background:#555;animation:dot 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  .agent.sel .name{background:#ffd54a}
  @keyframes legL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes type{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  @keyframes zz{0%,100%{transform:translate(0,0);opacity:.6}50%{transform:translate(3px,-4px);opacity:1}}
  @keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
  section.feed{max-width:480px;margin:12px auto 30px;padding:0 14px}
  section.feed h2{font-size:14px;margin:0 0 6px;color:var(--muted)}
  .ev{font-size:13px;padding:7px 0;border-bottom:1px solid #ffffff12;display:flex;gap:8px}
  .ev time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6000;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 18px 26px;transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -4px 20px #0008;max-width:520px;margin:0 auto}
  #sheet.open{transform:none}
  #sheet .hd{display:flex;align-items:center;gap:10px}
  #sheet .em{font-size:30px}
  #sheet h3{margin:0;font-size:18px}
  #sheet .role{color:var(--muted);font-size:13px;margin-top:2px}
  #sheet .st{display:inline-flex;align-items:center;gap:6px;margin:12px 0 6px;font-weight:700;font-size:14px}
  #sheet .task{font-size:15px;line-height:1.4}
  #sheet .meta{color:var(--muted);font-size:12px;margin-top:8px}
  #sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:22px}
</style>
</head>
<body>
<header>
  <h1>🏢 Офис агентов <span id="mode" class="badge">ДЕМО</span></h1>
  <div class="counts" id="counts"></div>
</header>
<div id="wrap"><div id="map"></div></div>
<section class="feed"><h2>Что происходит</h2><div id="feed"></div></section>
<div id="sheet"><button class="x" onclick="closeSheet()">×</button><div id="sheetBody"></div></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#262c3d'); tg.setBackgroundColor && tg.setBackgroundColor('#1d2230'); } catch(e){} }

/* ---------- Комнаты ---------- */
const CX = 180; // ось коридора
const ROOMS = {
  boss: {x:10, y:10, w:150,h:160, side:'L', doorY:95,  floor:'--floor-boss', label:'Кабинет маркетолога'},
  sc:   {x:200,y:10, w:150,h:160, side:'R', doorY:95,  floor:'--floor-sc',   label:'Разведка'},
  mkL:  {x:10, y:180,w:150,h:210, side:'L', doorY:285, floor:'--floor-mk',   label:'Маркетинг'},
  mkR:  {x:200,y:180,w:150,h:210, side:'R', doorY:285, floor:'--floor-mk',   label:'Маркетинг'},
  vidL: {x:10, y:400,w:150,h:210, side:'L', doorY:505, floor:'--floor-vid',  label:'Видеостудия'},
  vidR: {x:200,y:400,w:150,h:210, side:'R', doorY:505, floor:'--floor-vid',  label:'Видеостудия'},
  rest: {x:10, y:620,w:340,h:265, side:'B', doorY:620, floor:'--floor-rest', label:'Зона отдыха'},
};
function inner(r){ const R=ROOMS[r]; if(R.side==='L') return [R.x+R.w-12,R.doorY+12]; if(R.side==='R') return [R.x+12,R.doorY+12]; return [CX,R.y+22]; }
function corr(r){ const R=ROOMS[r]; return R.side==='B' ? [CX,R.y-6] : [CX,R.doorY+12]; }

/* ---------- Агенты ---------- */
const SK=['#f1c7a0','#e0ac80','#c68c5c','#a8714a'], HR=['#2b1d14','#3a2a1a','#111','#5a3b22','#6b6b6b'];
const DEPT={boss:'#c0392b', mk:'#2e86de', sc:'#27ae60', vid:'#8e44ad'};
const A = [
 ['marketolog','Маркетолог','Руководит всей командой','🎯','boss','boss',{tie:1}],
 ['razvedchik','Гл. разведчик','Руководит разведчиками','🔍','sc','sc',{cap:0}],
 ['r_insta','Разв. Insta','Разведка Instagram','📸','sc','sc',{}],
 ['r_uzum','Разв. Uzum','Наши карточки против конкурентов на Uzum','🟣','sc','sc',{}],
 ['r_wb','Разв. WB','Разведка Wildberries','🟪','sc','sc',{}],
 ['tovaroved','Товаровед','Остатки, цены, товары','📦','mk','mkL',{}],
 ['statistika','Статистика','Охваты и просмотры Instagram','📊','mk','mkL',{glasses:1}],
 ['kontent','Контент-план','Расписание постов и сторис','📅','mk','mkL',{}],
 ['smm','SMM','Профиль @tecnologia.uz','👤','mk','mkL',{}],
 ['dizayner','Дизайнер','Обложки, картинки','🖌','mk','mkL',{cap:1}],
 ['storis','Сторис','Сторис Instagram','📱','mk','mkL',{}],
 ['sahifachi','Сайт','Страницы товаров','🌐','mk','mkR',{}],
 ['targetolog','Таргетолог','Реклама (подготовка)','💰','mk','mkR',{glasses:1}],
 ['kanalchi','Канал','Telegram-канал магазина','📢','mk','mkR',{}],
 ['kitay','Китай','Поиск товаров на 1688/Taobao','🇨🇳','mk','mkR',{}],
 ['direktor','Директор','Руководит видео','🧠','vid','vidL',{beard:1}],
 ['analitik','Аналитик','Разбор товара и отзывов','🔎','vid','vidL',{glasses:1}],
 ['ssenarist','Сценарист','Сценарии Reels','📝','vid','vidL',{}],
 ['ovoz','Голос','Озвучка на узбекском','🎙','vid','vidL',{beard:1}],
 ['vizual','Визуал','Кадры и сцены','🎨','vid','vidR',{cap:1}],
 ['montajyor','Монтажёр','Сборка Reels','🎬','vid','vidR',{}],
 ['publikator','Публикатор','Публикация Reels и сторис','📤','vid','vidR',{}],
 ['otvetchik','Ответчик','Ответы на «+»','💬','vid','vidR',{}],
];
const REPORTS={sc:'Маркетологу (через Гл. разведчика)', mk:'Маркетологу', vid:'Директору', boss:'Вам'};

/* места за столами */
const SEATS={boss:[[85,110]], sc:[[245,78],[305,78],[245,148],[305,148]]};
['mkL','mkR','vidL','vidR'].forEach(r=>{const R=ROOMS[r]; const rows=r.startsWith('mk')?3:2; SEATS[r]=[];
  for(let i=0;i<rows;i++) for(const dx of [38,100]) SEATS[r].push([R.x+dx, R.y+(r.startsWith('mk')?62:70)+i*(r.startsWith('mk')?60:80)]);});
/* места отдыха */
const REST=[]; [40,80,120,240,280,320].forEach(x=>REST.push([x,690])); [162,202].forEach(x=>REST.push([x,714]));
for(let i=0;i<8;i++) REST.push([40+i*40,775]); for(let i=0;i<7;i++) REST.push([60+i*40,850]);
const isSleepSpot=i=>i<6||(i>=8&&i<16);
/* очередь к маркетологу */
const QUEUE=[]; for(let i=0;i<12;i++) QUEUE.push([CX, 70+i*24]);

const map=document.getElementById('map');
function el(tag,cls,style,html){const e=document.createElement(tag); if(cls)e.className=cls; if(style)Object.assign(e.style,style); if(html!=null)e.innerHTML=html; map.appendChild(e); return e;}
function px(o){const r={};for(const k in o)r[k]=typeof o[k]==='number'?o[k]+'px':o[k];return r;}

/* рисуем офис */
el('div','corr',px({left:CX-17,top:10,width:34,height:614}));
for(const k in ROOMS){const R=ROOMS[k]; const d=el('div','room',px({left:R.x,top:R.y,width:R.w,height:R.h,background:`var(${R.floor})`}));
  d.innerHTML=`<div class="lbl">${R.label}</div>`;
  if(R.side==='L') el('div','door',px({left:R.x+R.w-3,top:R.doorY,height:26}));
  if(R.side==='R') el('div','door',px({left:R.x,top:R.doorY,height:26}));
  if(R.side==='B') el('div','door',px({left:CX-17,top:R.y,width:34,height:3}));
}
/* декор */
const D=(t,x,y,s)=>el('div','deco',px({left:x,top:y,fontSize:s||14}),t);
D('🪟',20,22,18);D('🪴',135,140);D('🏆',22,140,13);D('🗺',215,22,14);D('🪴',330,145);D('🪴',20,365);D('🖨',325,365);D('📌',215,195,11);D('🪴',330,365);
D('🎥',20,585);D('💡',135,412,12);D('🎚',215,585);D('🪴',330,585);
D('📺',172,632,18);D('☕',214,694,11);D('🍵',140,694,11);D('🪴',20,640);D('🪴',328,640);D('🎮',172,752,14);D('🏓',333,815,13);D('📚',14,815,13);D('🪴',20,862);D('🪴',328,862);
el('div','rug',px({left:110,top:745,width:140,height:50}));
el('div','sofa',px({left:22,top:680,width:116,height:20}));el('div','sofa',px({left:222,top:680,width:116,height:20}));
el('div','counter',px({left:150,top:707,width:64,height:12}));
for(let i=0;i<8;i++) el('div','bean',px({left:28+i*40,top:772,background:['#e67e22','#16a085','#2980b9','#d35400','#8e44ad','#27ae60','#c0392b','#2c3e50','#f39c12'][i]}));

function figSVG(o){
  const sk=SK[o.s%SK.length], hr=HR[o.h%HR.length], sh=o.shirt, pa='#34495e';
  return `<svg viewBox="0 0 24 40" width="24" height="40"><g class="fig">
   <rect class="lg l" x="7" y="29" width="4.2" height="10" rx="1.6" fill="${pa}"/><rect class="lg r" x="12.8" y="29" width="4.2" height="10" rx="1.6" fill="${pa}"/>
   <rect class="arm l" x="3" y="18" width="4" height="11" rx="2" fill="${sh}"/><rect class="arm r" x="17" y="18" width="4" height="11" rx="2" fill="${sh}"/>
   <rect x="6" y="16.5" width="12" height="14" rx="3.5" fill="${sh}"/>
   ${o.tie?'<path d="M12 17.5l-1.6 2 1.6 7.5 1.6-7.5z" fill="#f1c40f"/>':''}
   <circle cx="12" cy="10" r="7" fill="${sk}"/>
   ${o.beard?`<path d="M5.4 11 Q6 17.5 12 17.3 Q18 17.5 18.6 11 Q17 14.5 12 14.6 Q7 14.5 5.4 11z" fill="${hr}"/>`:''}
   <path d="M5 9.5 Q4.6 2.2 12 2.6 Q19.4 2.2 19 9.5 Q17.5 5.6 12 6.1 Q6.5 5.6 5 9.5z" fill="${hr}"/>
   ${o.cap?`<path d="M4.8 7.8 Q5 2 12 2.2 Q19 2 19.2 7.8z" fill="${sh}"/><rect x="11" y="6.6" width="10" height="1.8" rx=".9" fill="${sh}"/>`:''}
   <g class="eyes"><circle cx="9.5" cy="10.4" r="1" fill="#222"/><circle cx="14.5" cy="10.4" r="1" fill="#222"/></g>
   <g class="eyes-c"><path d="M8.4 10.6h2.2M13.4 10.6h2.2" stroke="#222" stroke-width=".9" stroke-linecap="round"/></g>
   ${o.glasses?'<g fill="none" stroke="#222" stroke-width=".7"><circle cx="9.5" cy="10.4" r="2"/><circle cx="14.5" cy="10.4" r="2"/><path d="M11.5 10.4h1"/></g>':''}
   ${o.beard?'':'<path d="M10.4 13.4q1.6 1.1 3.2 0" stroke="#7a3b2e" fill="none" stroke-width=".8" stroke-linecap="round"/>'}
  </g></svg>`;
}

const agents={}; const roomUse={};
A.forEach(([id,name,role,em,dept,room,look],i)=>{
  roomUse[room]=(roomUse[room]||0); const seat=SEATS[room][roomUse[room]++];
  const big=room==='boss';
  const desk=el('div','desk'+(big?' big':''),px({left:seat[0]-(big?23:15),top:seat[1]-9,zIndex:seat[1]+6}));
  desk.innerHTML='<div class="laptop"></div>';
  const e=el('div','agent',{zIndex:seat[1]}); e.innerHTML=figSVG({...look,s:i*7,h:i*3,shirt:DEPT[dept]})+`<div class="bubble" style="display:none"></div><div class="name">${name}</div>`;
  const a={id,name,role,em,dept,room,seat,desk,laptop:desk.firstChild,e,bub:e.querySelector('.bubble'),x:seat[0],y:seat[1],cur:room,path:[],state:'work',task:'',since:Date.now(),spot:null};
  e.onclick=ev=>{ev.stopPropagation();openSheet(a);};
  agents[id]=a; place(a);
});

function place(a){ a.e.style.transform=`translate(${a.x-12}px,${a.y-40}px)`; a.e.style.zIndex=Math.round(a.y); }

/* маршруты */
const restUsed=new Set(), queueUsed=new Set();
function freeSpot(list,used){ const idx=list.map((_,i)=>i).filter(i=>!used.has(i)); return idx.length? idx[Math.floor(Math.random()*idx.length)] : 0; }
function route(a,target,troom){
  const pts=[]; const from=a.cur;
  if(from!==troom){
    if(from!=='corr'){pts.push(inner(from),corr(from));}
    if(troom!=='corr'){pts.push(corr(troom),inner(troom));}
  }
  pts.push(target); a.path=pts; a.cur=troom;
}
function releaseSpot(a){ if(a.spot){ (a.spot.t==='rest'?restUsed:queueUsed).delete(a.spot.i); a.spot=null; } }

const LBL={work:'Работает',rest:'Отдыхает',wait:'Ждёт одобрения',err:'Проблема'};
const CLR={work:'var(--work)',rest:'var(--rest)',wait:'var(--wait)',err:'var(--err)'};

function setState(a,state,task,since){
  const changed = a.state!==state || a.task!==task;
  const prev=a.state; a.state=state; a.task=task||''; a.since=since||Date.now();
  if(prev!==state || a.path.length===0 && !atTarget(a)){
    releaseSpot(a);
    if(state==='work'||state==='err') route(a,a.seat,a.room);
    else if(state==='rest'){ const i=freeSpot(REST,restUsed); restUsed.add(i); a.spot={t:'rest',i}; route(a,REST[i],'rest'); }
    else if(state==='wait' && a.id==='marketolog'){ route(a,a.seat,a.room); }
    else if(state==='wait'){ const i=freeSpot(QUEUE,queueUsed); queueUsed.add(i); a.spot={t:'wait',i}; route(a,QUEUE[i],'corr'); }
  }
  decorate(a);
  if(changed) logEvent(a);
  renderCounts();
  if(sheetA===a) openSheet(a);
}
function atTarget(a){ return true; }

function decorate(a){
  const moving=a.path.length>0, seated=!moving && (a.state==='work'||a.state==='err');
  a.e.classList.toggle('walk',moving);
  a.e.classList.toggle('typing',seated && a.state==='work');
  a.e.classList.toggle('sleep',!moving && a.state==='rest' && a.spot && isSleepSpot(a.spot.i));
  a.laptop.classList.toggle('on',seated);
  const b=a.bub; b.className='bubble';
  if(moving){ b.style.display='none'; return; }
  b.style.display='';
  if(a.state==='work'){ b.innerHTML=`${a.em} <span class="dots"><i></i><i></i><i></i></span>`; }
  else if(a.state==='wait'){ b.classList.add('wait'); b.textContent='📄'; }
  else if(a.state==='err'){ b.classList.add('err'); b.textContent='!'; }
  else { b.classList.add('rest'); b.textContent = a.spot && !isSleepSpot(a.spot.i) ? '☕' : '💤'; }
}

/* движение */
let last=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  for(const id in agents){ const a=agents[id]; if(!a.path.length) continue;
    const [tx,ty]=a.path[0]; const dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy), step=62*dt;
    if(d<=step){ a.x=tx;a.y=ty;a.path.shift(); if(!a.path.length) decorate(a); }
    else { a.x+=dx/d*step; a.y+=dy/d*step; if(!a.e.classList.contains('walk')) decorate(a); }
    place(a);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* счётчики, лента, карточка */
function renderCounts(){
  const c={work:0,rest:0,wait:0,err:0}; for(const id in agents) c[agents[id].state]++;
  document.getElementById('counts').innerHTML=
   `<span class="cnt"><span class="dot" style="background:var(--work)"></span>Работают ${c.work}</span>`+
   `<span class="cnt"><span class="dot" style="background:var(--rest)"></span>Отдыхают ${c.rest}</span>`+
   `<span class="cnt"><span class="dot" style="background:var(--wait)"></span>Ждут ${c.wait}</span>`+
   (c.err?`<span class="cnt"><span class="dot" style="background:var(--err)"></span>Проблема ${c.err}</span>`:'');
}
const feed=[]; let booting=true;
function logEvent(a){
  if(booting) return;
  const verb={work:'работает:',rest:'ушёл отдыхать',wait:'ждёт одобрения:',err:'проблема:'}[a.state];
  feed.unshift({t:new Date(),txt:`${a.em} <b>${a.name}</b> ${verb} ${a.state==='rest'?'':esc(a.task)}`});
  feed.length=Math.min(feed.length,30);
  document.getElementById('feed').innerHTML=feed.map(f=>`<div class="ev"><time>${f.t.toTimeString().slice(0,5)}</time><span>${f.txt}</span></div>`).join('');
}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ago(ms){const m=Math.round((Date.now()-ms)/60000); return m<1?'только что':m<60?m+' мин назад':Math.round(m/60)+' ч назад';}
let sheetA=null;
function openSheet(a){
  if(sheetA&&sheetA!==a) sheetA.e.classList.remove('sel');
  sheetA=a; a.e.classList.add('sel');
  document.getElementById('sheetBody').innerHTML=`
   <div class="hd"><div class="em">${a.em}</div><div><h3>${a.name}</h3><div class="role">${a.role}</div></div></div>
   <div class="st" style="color:${CLR[a.state]}"><span class="dot" style="background:${CLR[a.state]}"></span>${LBL[a.state]}</div>
   <div class="task">${a.state==='rest' ? 'Сейчас задач нет' : esc(a.task)}</div>
   <div class="meta">Обновлено: ${ago(a.since)} · Отчитывается: ${REPORTS[a.dept]}</div>`;
  document.getElementById('sheet').classList.add('open');
  if(tg&&tg.HapticFeedback) try{tg.HapticFeedback.selectionChanged();}catch(e){}
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); if(sheetA) sheetA.e.classList.remove('sel'); sheetA=null; }
document.addEventListener('click',e=>{ if(!e.target.closest('#sheet')) closeSheet(); });

function fit(){ const w=Math.min(document.documentElement.clientWidth,520)-8; const s=w/360; map.style.transform=`scale(${s})`;
  const wrap=document.getElementById('wrap'); wrap.style.width=w+'px'; wrap.style.height=(895*s)+'px'; }

/* ---------- Данные: status.json или демо ---------- */
/* ключ: только в кнопке «Офис» вашего чата (?k=...), запоминается на устройстве */
let KEY=null;
try{ const q=new URLSearchParams(location.search).get('k'); if(q){ localStorage.setItem('office_k',q); history.replaceState(null,'',location.pathname+location.hash); } KEY=localStorage.getItem('office_k'); }catch(e){ KEY=new URLSearchParams(location.search).get('k'); }
const STATUS_URL='https://raw.githubusercontent.com/ireezq/ireezq.github.io/status/s.txt';
function b64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function fetchStatus(){
  if(!KEY) return null;
  const r=await fetch(STATUS_URL+'?t='+Math.floor(Date.now()/15000),{cache:'no-store'}); if(!r.ok) throw 0;
  const raw=b64((await r.text()).trim());
  const key=await crypto.subtle.importKey('raw',b64(KEY),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function snapAll(){ for(const id in agents){ const a=agents[id]; if(a.path.length){ const p=a.path[a.path.length-1]; a.x=p[0];a.y=p[1];a.path=[];a.cur=(a.state==='rest'?'rest':a.state==='wait'&&a.id!=='marketolog'?'corr':a.room); place(a); decorate(a);} } }
const STALE_MIN=90;
async function loadReal(){
  try{
    const j=await fetchStatus(); if(!j||!j.agents) throw 0;
    document.getElementById('mode').textContent='LIVE'; document.getElementById('mode').classList.add('live');
    for(const id in agents){ const s=j.agents[id]; const a=agents[id];
      let st=s?s.state:'rest', since=s&&s.since?Date.parse(s.since):Date.now();
      if((st==='work') && Date.now()-since>STALE_MIN*60000) st='rest';
      if(!LBL[st]) st='rest';
      if(st!==a.state || (s&&s.task||'')!==a.task) setState(a,st,s&&s.task,since);
    }
    return true;
  }catch(e){ return false; }
}

};
function demoPick(id){ const r=Math.random(); const st = r<.52?'work':r<.86?'rest':r<.96?'wait':'err';
  const t=DEMO_TASKS[id]||['Работаю']; let task=t[Math.floor(Math.random()*t.length)];
  if(st==='wait') task=(id==='marketolog'?'Жду вашего ответа: ':'Сдал работу: ')+task.toLowerCase(); if(st==='err') task='Не получилось: '+task.toLowerCase();
  return [st,task]; }
(async()=>{
  const live=await loadReal();
  if(live){ snapAll(); booting=false; setInterval(loadReal,15000); }
  else if(KEY){ const m=document.getElementById('mode'); m.textContent='НЕТ СВЯЗИ'; m.style.background='var(--err)';
    for(const id in agents) setState(agents[id],'rest',''); snapAll(); booting=false;
    const iv=setInterval(async()=>{ if(await loadReal()) { clearInterval(iv); setInterval(loadReal,15000); } },15000); }
  else {
    for(const id in agents){ const [s,t]=demoPick(id); setState(agents[id],s,t,Date.now()-Math.random()*40*60000); }
    snapAll();
    booting=false;
    setInterval(()=>{ const ids=Object.keys(agents); const a=agents[ids[Math.floor(Math.random()*ids.length)]]; if(a.path.length) return; const [s,t]=demoPick(a.id); setState(a,s,t); },3500);
  }
  renderCounts();
})();
