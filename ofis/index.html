<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Городок агентов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#050816; --panel:#0a1030; --text:#eaf2ff; --muted:#8a9bc4; --cy:#19d3ff;
    --work:#2dff8a; --rest:#6b7fa8; --wait:#ffd23f; --err:#ff3b5c;
    --li:1.3; --ni:1.5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  body{background:radial-gradient(900px 500px at 50% -10%,#10205a55,transparent),var(--bg)}
  header{position:sticky;top:0;z-index:5000;background:#070c26ee;backdrop-filter:blur(6px);padding:9px 12px 7px;border-bottom:1px solid #19d3ff55;box-shadow:0 2px 18px #19d3ff22}
  header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:.5px;text-shadow:0 0 12px #19d3ff99}
  .badge{font-size:10px;font-weight:800;background:#ffb020;color:#201400;border-radius:6px;padding:2px 6px;box-shadow:0 0 10px #ffb02088}
  .badge.live{background:var(--work);box-shadow:0 0 10px var(--work)}
  .counts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .cnt{font-size:12px;background:#0d1740;border:1px solid #ffffff14;border-radius:20px;padding:3px 9px;display:flex;gap:5px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .chips{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip2{flex:none;font-size:11.5px;font-weight:700;border-radius:14px;padding:4px 10px;border:1px solid var(--c);color:var(--c);background:#0a1030;box-shadow:0 0 8px var(--g);cursor:pointer}
  #zoomOut{display:none;margin-left:auto;background:#19d3ff;color:#00131a;border:0;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:800;box-shadow:0 0 12px #19d3ff99}
  #wrap{position:relative;margin:10px auto 0;overflow:hidden;touch-action:pan-y;transition:height .35s ease;border:1px solid #19d3ff33;border-radius:14px;box-shadow:0 0 30px #19d3ff1a,inset 0 0 40px #0006;
    background:radial-gradient(600px 400px at 50% 30%,#0d1a4a,#050816)}
  #map{position:absolute;left:0;top:0;width:800px;transform-origin:0 0;transition:transform .35s ease;
    background-image:linear-gradient(#19d3ff0d 1px,transparent 1px),linear-gradient(90deg,#19d3ff0d 1px,transparent 1px);background-size:40px 40px}
  #map.drag{transition:none}
  .blk{position:absolute;border:1.5px solid var(--c);border-radius:14px;background:linear-gradient(180deg,var(--f),#0a1030d8 70%);box-shadow:0 0 18px var(--g),inset 0 0 26px var(--f);cursor:zoom-in;z-index:1}
  .gate{position:absolute;width:46px;height:6px;left:50%;margin-left:-23px;background:var(--c);box-shadow:0 0 12px var(--c);border-radius:3px}
  .gate.b{bottom:-4px}.gate.t{top:-4px}
  .bl{position:absolute;left:8px;top:6px;max-width:calc((100% - 16px) / var(--li));font-size:10.5px;font-weight:900;letter-spacing:.8px;color:var(--c);text-shadow:0 0 8px var(--c);
    background:#050816cc;border:1px solid var(--c);border-radius:8px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:scale(var(--li));transform-origin:0 0;z-index:3;pointer-events:none}
  .bl i{font-style:normal;color:var(--work);margin-left:5px;text-shadow:0 0 6px var(--work)}
  .road{position:absolute;left:0;width:800px;height:28px;background:linear-gradient(#070c26,#0a1236,#070c26);border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;z-index:0}
  .road:after{content:'';position:absolute;left:0;right:0;top:13px;height:2px;background:repeating-linear-gradient(90deg,#19d3ff66 0 14px,transparent 14px 28px)}
  .av{position:absolute;left:390px;width:20px;background:linear-gradient(90deg,#070c26,#0b1440,#070c26);border-left:1px solid #19d3ff22;border-right:1px solid #19d3ff22;overflow:hidden;z-index:0}
  .av:after{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,#19d3ff66 0 14px,transparent 14px 28px)}
  .pkt{position:absolute;left:7px;width:6px;height:16px;border-radius:3px;background:var(--c);box-shadow:0 0 10px var(--c);animation:pkt 6s linear infinite;z-index:2}
  @keyframes pkt{from{top:-20px}to{top:100%}}
  .ban{position:absolute;left:10px;width:780px;height:22px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:13px;letter-spacing:7px;color:var(--c);text-shadow:0 0 12px var(--c);z-index:1;pointer-events:none}
  .ban:before,.ban:after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 8px var(--c)}
  .park{position:absolute;left:10px;width:780px;border:1.5px solid #2dff8a66;border-radius:18px;background:radial-gradient(400px 120px at 50% 0,#0f4a3a55,#06142acc);box-shadow:0 0 22px #2dff8a22,inset 0 0 30px #2dff8a14;z-index:1}
  .park .pl{position:absolute;left:12px;top:6px;font-size:10.5px;font-weight:900;letter-spacing:1px;color:#2dff8a;text-shadow:0 0 8px #2dff8a;transform:scale(var(--li));transform-origin:0 0;pointer-events:none}
  .pond{position:absolute;border-radius:50%;background:radial-gradient(ellipse,#19d3ff66,#0a2a6a88);border:1.5px solid #19d3ffaa;box-shadow:0 0 20px #19d3ff55,inset 0 0 14px #19d3ff55;overflow:hidden;z-index:1}
  .pond:before,.pond:after{content:'';position:absolute;left:50%;top:50%;width:20px;height:8px;margin:-4px 0 0 -10px;border:1px solid #bff;border-radius:50%;animation:rip 3s ease-out infinite;opacity:0}
  .pond:after{animation-delay:1.5s}
  @keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(4);opacity:0}}
  .arc{position:absolute;width:38px;height:50px;border:1.5px solid var(--ac);border-radius:6px 6px 3px 3px;background:#0a1030;box-shadow:0 0 12px var(--ac);z-index:1}
  .arc:before{content:'';position:absolute;left:4px;right:4px;top:5px;height:20px;background:var(--ac);opacity:.7;border-radius:2px;animation:glow 1.6s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(.6)}to{filter:brightness(1.4)}}
  .amen{position:absolute;border:1.5px solid var(--c);border-radius:9px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,#0a1030),#0a1030);box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent);z-index:1;display:flex;align-items:center;justify-content:center;font-size:20px}
  .fount{position:absolute;border-radius:50%;border:2px solid #19d3ff;background:radial-gradient(circle,#bff 0 6%,#19d3ff66 7% 45%,#0a2a6a 46%);box-shadow:0 0 22px #19d3ff88;z-index:1}
  .agent.t3 svg{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 6px var(--ac)) drop-shadow(0 0 3px #fff)}
  .agent.t3 .np{display:block;font-size:14px;font-weight:900;color:#fff;border:2px solid #fff;background:#1a0a3aee;text-shadow:0 0 10px #ff3df0;box-shadow:0 0 18px #ff3df0,0 0 8px #fff}
  .bench{position:absolute;height:5px;border-radius:3px;background:#2dff8a55;box-shadow:0 0 8px #2dff8a66;z-index:1}
  .lamp{position:absolute;width:3px;height:36px;background:#7aa;z-index:1}
  .lamp:before{content:'';position:absolute;left:-6px;top:-8px;width:15px;height:15px;border-radius:50%;background:#fff6c8;box-shadow:0 0 18px 6px #ffe98a88;animation:glow 3s ease-in-out infinite alternate}
  .plbl{position:absolute;font-size:9px;font-weight:800;letter-spacing:1px;color:#9ff;text-shadow:0 0 6px #19d3ff;z-index:1;pointer-events:none}
  .tower{position:absolute;z-index:1;border:1.5px solid #19d3ff55;border-radius:14px;background:linear-gradient(#0a1030cc,#050816);box-shadow:0 0 18px #19d3ff22;overflow:hidden;text-align:center}
  .tower svg{position:absolute;left:0;top:0;width:100%;height:calc(100% - 78px)}
  .tower .tx{position:absolute;left:0;right:0;bottom:8px;font-weight:900}
  .tower .t1{font-size:15px;letter-spacing:3px;color:#19d3ff;text-shadow:0 0 10px #19d3ff}
  .tower .t2{font:800 18px monospace;color:#2dff8a;text-shadow:0 0 8px #2dff8a;margin-top:2px}
  .tower .t3{font-size:11px;color:#ffd23f;text-shadow:0 0 6px #ffd23f;margin-top:2px}
  .wn{animation:wn 2.4s ease-in-out infinite}
  @keyframes wn{0%,100%{opacity:.25}50%{opacity:1}}
  .seat{position:absolute;border-radius:50%;border:1px solid var(--c);background:#0a1030;opacity:.55;z-index:2;pointer-events:none}
  .seat.on{opacity:1;box-shadow:0 0 12px var(--c),inset 0 0 8px var(--c);background:var(--f)}

  /* ---- агенты ---- */
  .agent{position:absolute;left:0;top:0;width:var(--w);height:var(--h);cursor:pointer;will-change:transform}
  .agent .fig{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .agent.walk .fig{animation:bob .4s ease-in-out infinite}
  .agent svg{display:block;overflow:visible;position:relative;z-index:1;filter:drop-shadow(0 0 3px var(--c))}
  .agent.t1 svg{filter:drop-shadow(0 0 6px var(--ac))}
  .agent.t2 svg{filter:drop-shadow(0 0 9px var(--ac)) drop-shadow(0 0 3px #fff8)}
  .ring{position:absolute;left:10%;bottom:-4px;width:80%;height:calc(var(--w)*.26);border-radius:50%;background:var(--rest);opacity:.55;filter:blur(1px)}
  .agent.s-work .ring{background:var(--work);opacity:.9;box-shadow:0 0 12px var(--work);animation:ringp 1.4s ease-in-out infinite}
  .agent.s-wait .ring{background:var(--wait);opacity:.95;box-shadow:0 0 12px var(--wait);animation:ringp .9s ease-in-out infinite}
  .agent.s-err .ring{background:var(--err);opacity:.95;box-shadow:0 0 14px var(--err);animation:ringp .5s ease-in-out infinite}
  .aura{position:absolute;left:50%;bottom:-6px;width:150%;height:calc(var(--w)*.5);margin-left:-75%;border-radius:50%;border:2px solid var(--ac);box-shadow:0 0 14px var(--ac),inset 0 0 12px var(--ac);opacity:.85;animation:aura 2.4s ease-in-out infinite;pointer-events:none}
  .aura.a2{width:210%;margin-left:-105%;height:calc(var(--w)*.7);bottom:-12px;opacity:.5;animation-delay:-1.2s}
  .agent.t1 .aura{width:130%;margin-left:-65%;opacity:.7}
  @keyframes aura{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:.45}}
  .beam{position:absolute;left:50%;bottom:0;width:150%;height:210%;margin-left:-75%;background:linear-gradient(to top,var(--ac),transparent);opacity:.3;clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);pointer-events:none;animation:beam 3s ease-in-out infinite}
  .agent.t1 .beam{opacity:.2;height:170%}
  @keyframes beam{0%,100%{opacity:.32}50%{opacity:.12}}
  .bc{position:absolute;left:50%;top:var(--bt);width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--rest);box-shadow:0 0 8px var(--rest);transform:scale(var(--ni));z-index:3}
  .agent.s-work .bc{background:var(--work);box-shadow:0 0 10px var(--work)}
  .agent.s-wait .bc{background:var(--wait);box-shadow:0 0 12px var(--wait);animation:bcp .9s infinite alternate}
  .agent.s-err .bc{background:var(--err);box-shadow:0 0 12px var(--err);animation:bcp .5s infinite alternate}
  @keyframes bcp{from{opacity:.4}to{opacity:1}}
  .agent.t3{--bt:-34px;--bb:37px}.agent.t0{--bt:-10px;--bb:12px}.agent.t1{--bt:-12px;--bb:15px}.agent.t2{--bt:-28px;--bb:31px}
  .np{display:none;position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%) scale(var(--ni));transform-origin:50% 0;white-space:nowrap;font-size:9px;font-weight:800;color:#dff;background:#050816e6;border:1px solid var(--c);border-radius:6px;padding:0 4px;pointer-events:none;z-index:4;box-shadow:0 0 6px var(--g)}
  .agent.t1 .np{display:block;font-size:11px;border-color:var(--ac);color:#fff;text-shadow:0 0 6px var(--ac);box-shadow:0 0 10px var(--ac)}
  .agent.t2 .np{display:block;font-size:13px;font-weight:900;color:#ffe9a0;border:1.5px solid #ffd23f;background:#2a1a00ee;text-shadow:0 0 8px #ffd23f;box-shadow:0 0 14px #ffd23f}
  #map.zoomed .np{display:block}
  .bubble{display:none;position:absolute;bottom:calc(100% + var(--bb));left:50%;transform:translateX(-50%) scale(var(--ni));transform-origin:50% 100%;background:#0a1030f2;color:#eaf2ff;border:1.5px solid var(--work);border-radius:8px;padding:1px 5px;font-size:9px;font-weight:700;white-space:nowrap;box-shadow:0 0 10px #2dff8a66;pointer-events:none;z-index:5}
  .agent.s-wait .bubble,.agent.s-err .bubble,#map.zoomed .bubble{display:block}
  .bubble.rest{border-color:#6b7fa8;color:#aab;box-shadow:none}
  .bubble.wait{background:var(--wait);color:#241800;border-color:#fff;animation:pulse .9s infinite alternate}
  .bubble.err{background:var(--err);color:#fff;border-color:#fff;animation:pulse .5s infinite alternate}
  .bubble .al{display:none;font-weight:600}
  #map.zoomed .bubble .al{display:inline}
  .agent.sel .bubble{display:block;background:#ffd23f;color:#201400}
  .agent.sel .np{display:block;background:#ffd23f;color:#201400}
  @keyframes pulse{from{transform:translateX(-50%) scale(var(--ni))}to{transform:translateX(-50%) scale(calc(var(--ni)*1.1))}}
  @keyframes ringp{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .prop{position:absolute;left:50%;top:calc(var(--h)*.46);transform:translateX(-50%);font-size:calc(var(--w)*.36);line-height:1;display:none;pointer-events:none;z-index:2}
  .eyes-c{display:none}
  .agent.sleep .eyes{display:none}.agent.sleep .eyes-c{display:block}
  .spin{display:inline-block;animation:spin 1.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lg{transform-box:fill-box;transform-origin:50% 0}
  .agent.walk .lg.l{animation:legL .4s ease-in-out infinite}
  .agent.walk .lg.r{animation:legL .4s ease-in-out infinite reverse}
  .arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .3s}
  .agent.typing .arm.l{animation:type .22s ease-in-out infinite alternate}
  .agent.typing .arm.r{animation:type .22s ease-in-out infinite alternate-reverse}
  .agent.typing .fig{animation:bob 1.2s ease-in-out infinite}
  .agent.reading .arm.l{transform:rotate(-42deg)}.agent.reading .arm.r{transform:rotate(42deg)}
  .agent.reading .fig{animation:nod 2.4s ease-in-out infinite}
  .agent.gaming .arm.l{animation:pad .18s infinite alternate}.agent.gaming .arm.r{animation:pad .18s infinite alternate-reverse}
  .agent.thinking .arm.r{transform:rotate(150deg)}.agent.thinking .fig{animation:think 3s ease-in-out infinite}
  .agent.talking .arm.r{animation:wave .5s ease-in-out infinite alternate}
  .agent.talking .fig{animation:bob .8s ease-in-out infinite}
  .agent.sipping .arm.r{animation:sip 3s ease-in-out infinite}
  .agent.sipping .prop{animation:sipP 3s ease-in-out infinite}
  .agent.stretch .arm.l{animation:strL 1.6s ease-in-out infinite}.agent.stretch .arm.r{animation:strR 1.6s ease-in-out infinite}
  .agent.stretch .fig,.agent.jump .fig{animation:hop .6s ease-in-out infinite}
  .agent.jump .arm.r{animation:wave .3s ease-in-out infinite alternate}
  .agent.shake .fig{animation:shake .35s linear infinite}
  .agent.waitp .arm.r{transform:rotate(165deg)}
  .agent.sleep .fig{transform:rotate(-8deg);animation:none}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) translateY(.6px)}}
  @keyframes pad{from{transform:rotate(-38deg)}to{transform:rotate(-46deg)}}
  @keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
  @keyframes wave{from{transform:rotate(140deg)}to{transform:rotate(195deg)}}
  @keyframes sip{0%,55%,100%{transform:rotate(20deg)}65%,85%{transform:rotate(150deg)}}
  @keyframes sipP{0%,55%,100%{transform:translate(2px,0)}65%,85%{transform:translate(2px,-13px)}}
  @keyframes strL{0%,100%{transform:rotate(0)}50%{transform:rotate(170deg)}}
  @keyframes strR{0%,100%{transform:rotate(0)}50%{transform:rotate(-170deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
  @keyframes legL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes type{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

  .hint2{font-size:11px;color:var(--muted);margin:6px 12px 0;text-align:center}
  section.feed{max-width:520px;margin:12px auto 30px;padding:0 14px}
  section.feed h2{font-size:14px;margin:0 0 6px;color:var(--cy);text-shadow:0 0 8px #19d3ff77}
  .row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #19d3ff18;cursor:pointer}
  .row .em{font-size:22px;width:28px;text-align:center}
  .row .nm{font-weight:700;font-size:14px}
  .row .tk{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.3}
  .row .chip{font-size:11.5px;font-weight:800;border-radius:10px;padding:2px 8px;color:#06101a;white-space:nowrap}
  .row .ag{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .ev{font-size:13px;padding:7px 0;border-bottom:1px solid #19d3ff18;display:flex;gap:8px}
  .ev time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6000;background:#0a1030;border:1px solid #19d3ff66;border-bottom:0;border-radius:16px 16px 0 0;padding:16px 18px 26px;transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -4px 30px #19d3ff33;max-width:520px;margin:0 auto}
  #sheet.open{transform:none}
  #sheet .hd{display:flex;align-items:center;gap:10px}
  #sheet .em{font-size:30px}
  #sheet h3{margin:0;font-size:18px}
  #sheet .role{color:var(--muted);font-size:13px;margin-top:2px}
  #sheet .st{display:inline-flex;align-items:center;gap:6px;margin:12px 0 6px;font-weight:800;font-size:14px}
  #sheet .task{font-size:15px;line-height:1.4}
  #sheet .meta{color:var(--muted);font-size:12px;margin-top:8px}
  #sheet .order{margin-top:14px}
  #sheet textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid #19d3ff44;background:#050816;color:var(--text);padding:9px;font:inherit;font-size:15px;resize:vertical}
  #sheet .send{margin-top:8px;width:100%;padding:11px;border:0;border-radius:10px;background:#19d3ff;color:#00131a;font-weight:800;font-size:15px;box-shadow:0 0 14px #19d3ff88}
  #sheet .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.4}
  #sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:22px}
</style>
</head>
<body>
<header>
  <h1>🏙 Городок агентов <span id="mode" class="badge">ДЕМО</span> <button id="zoomOut" onclick="event.stopPropagation();zoomTo(null)">← Весь город</button></h1>
  <div class="counts" id="counts"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="wrap"><div id="map"></div></div>
<div class="hint2">🤏 Два пальца — приблизить/отдалить, одним — двигать · нажмите на район или агента · 👑 главный · ★ главные команд</div>
<section class="feed"><h2>Кто чем занят</h2><div id="list"></div></section>
<section class="feed"><h2>Что происходит</h2><div id="feed"></div></section>
<div id="sheet"><button class="x" onclick="closeSheet()">×</button><div id="sheetBody"></div></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#070c26'); tg.setBackgroundColor && tg.setBackgroundColor('#050816'); } catch(e){} }

/* ---------- Данные об агентах ---------- */
const SK=['#f1c7a0','#e0ac80','#c68c5c','#a8714a'], HR=['#2b1d14','#3a2a1a','#111','#5a3b22','#6b6b6b'];
const T2=new Set(['marketolog','mp_glavnyj','pt_glavnyj']);
const T3=new Set(['vid_sozdatel','mp_sozdatel']);

  const dt=Math.min(.05,(t-last)/1000); last=t;

function demoTasks(id){ if(DEMO_TASKS[id]) return DEMO_TASKS[id]; const m=id.match(/^mp_(?:uz\d|wb)_(\w+)$/); if(m) return m[1]==='glavnyj'?['Раздаю задачи команде','Сводка для главного']:(MPD[m[1]]||['Работаю']); return ['Работаю']; }
function demoPick(id){ const r=Math.random(); const st=r<.52?'work':r<.86?'rest':r<.96?'wait':'err';
  const t=demoTasks(id); let task=t[Math.floor(Math.random()*t.length)];
  if(st==='wait') task=(tierOf(id)>=2?'Жду вашего ответа: ':'Сдал работу: ')+task.toLowerCase(); if(st==='err') task='Не получилось: '+task.toLowerCase();
  return [st,task]; }
(async()=>{
  const live=await loadReal();
  if(live){ snapAll(); booting=false; setInterval(loadReal,15000); }
  else if(KEY){ const m=document.getElementById('mode'); m.textContent='НЕТ СВЯЗИ'; m.style.background='var(--err)';
    for(const id in agents) setState(agents[id],'rest',''); snapAll(); booting=false;
    const iv=setInterval(async()=>{ if(await loadReal()) { clearInterval(iv); setInterval(loadReal,15000); } },15000); }
  else {
    const AK=Object.keys(ACT); for(const id in agents){ const [s,t]=demoPick(id); setState(agents[id],s,t,Date.now()-Math.random()*40*60000,pick(AK)); }
    snapAll(); booting=false;
    setInterval(()=>{ const ids=Object.keys(agents); const a=agents[ids[Math.floor(Math.random()*ids.length)]]; if(a.path.length) return; const [s,t]=demoPick(a.id); setState(a,s,t,0,pick(AK)); },2500);
    setInterval(()=>{ const w=Object.values(agents).filter(a=>a.state==='work'&&!a.path.length); if(w.length) setAct(pick(w),pick(AK)); },2500);
  }
  renderCounts(); renderList();
})();
