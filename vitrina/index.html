<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahsulotlar</title><meta name="theme-color" content="#0d231b">
<style>
:root{--bg1:#132b22;--bg2:#06110d;--gold:#c9a54a;--amber:#f2a63b;--cream:#faf8f3;--mute:#9fb0a8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--cream);background:#0d231b;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
.wrap{max-width:460px;margin:0 auto;padding:36px 20px 40px}
.head{text-align:center}
.head img{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 14px}
.head h1{margin:0;font-size:24px;letter-spacing:-.01em}
.head h1 b{color:var(--amber)}
.head p{margin:6px 0 0;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 0}
.tile{display:block}
.tile .ph{aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid rgba(201,165,74,.45);background:#0a1a15}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{display:block;margin:8px 2px 0;font-weight:600;font-size:14px;line-height:1.3}
.tile:active .ph{opacity:.85}
.tile.wide{grid-column:1 / -1}
.tile.wide .ph{aspect-ratio:16/10}
.label{margin:34px 0 10px;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.shops{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 20px;border-radius:14px;
  font-weight:600;border:1.5px solid var(--gold);color:var(--cream)}
.btn::after{content:"→";color:var(--amber);font-size:18px;font-weight:400}
.btn.main{background:var(--amber);border-color:var(--amber);color:#1a1208}
.btn.main::after{color:#1a1208}
.btn:active{opacity:.85}
.foot{margin:36px 0 0;text-align:center;font-size:12px;color:var(--mute)}
.foot a{text-decoration:underline}
.card{border:1px solid rgba(201,165,74,.45);border-radius:16px;overflow:hidden;background:#0a1a15;margin:0 0 16px}
.card .ph{aspect-ratio:4/3;background:#0a1a15}.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .in{padding:14px 16px 16px}.card h2{margin:0 0 12px;font-size:18px}
.card .btn{min-height:50px}.list{margin-top:26px}
</style></head><body><main class="wrap"><header class="head"><img src="logo.png" alt="iReezq" width="96" height="96"><h1>Mahsulotlar</h1></header><div class="list"><article class="card"><a href="../massajyor/"><div class="ph"><img src="../massajyor/1.jpg" alt="Massajyor" loading="lazy"></div></a><div class="in"><h2>Massajyor</h2><a class="btn main" href="https://ireezq.github.io/massajyor/">Ko‘rish</a></div></article><article class="card"><a href="../namlagich/"><div class="ph"><img src="../namlagich/1.jpg" alt="Namlagich" loading="lazy"></div></a><div class="in"><h2>Namlagich</h2><a class="btn main" href="https://ireezq.github.io/namlagich/">Ko‘rish</a></div></article><article class="card"><a href="../rolikovyj/"><div class="ph"><img src="../rolikovyj/1.jpg" alt="Roliklı massajyor" loading="lazy"></div></a><div class="in"><h2>Roliklı massajyor</h2><a class="btn main" href="https://ireezq.github.io/rolikovyj/">Ko‘rish</a></div></article><article class="card"><a href="../carplay/"><div class="ph"><img src="../carplay/1.jpg" alt="CarPlay adapteri" loading="lazy"></div></a><div class="in"><h2>CarPlay adapteri</h2><a class="btn main" href="https://ireezq.github.io/carplay/">Ko‘rish</a></div></article><article class="card"><a href="../husky/"><div class="ph"><img src="../husky/1.jpg" alt="Husky o‘yinchoq" loading="lazy"></div></a><div class="in"><h2>Husky o‘yinchoq</h2><a class="btn main" href="https://ireezq.github.io/husky/">Ko‘rish</a></div></article></div></main></body></html>
